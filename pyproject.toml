[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-transfer-agent"
version = "0.1.0"
description = "Create evidence-linked developer onboarding guides for assigned tasks"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
knowledge-transfer = "knowledge_transfer_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
